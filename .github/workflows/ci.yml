name: CI

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            apps/api/package-lock.json
            apps/web/package-lock.json
      - run: npm ci
        working-directory: apps/api
      - run: npm test
        working-directory: apps/api
      - run: npm ci
        working-directory: apps/web
      - run: npm run lint
        working-directory: apps/web
      - run: npm test
        working-directory: apps/web
      - run: npm run build
        working-directory: apps/web

  # Pages is static, so snapshot the real API's responses into the site.
  pages-build:
    needs: checks
    # Deploy on pushes, or on a manual run from develop (never from another branch).
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/develop')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            apps/web/package-lock.json
            apps/api/package-lock.json
      - run: npm ci
        working-directory: apps/api
      - run: npm ci
        working-directory: apps/web
      - name: Snapshot API into the site
        working-directory: apps/api
        env:
          APP_VERSION: pages+build.${{ github.run_number }}
          GIT_SHA: ${{ github.sha }}
        run: |
          export BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          node src/server.js &
          API_PID=$!
          npx --yes wait-on http://localhost:3000/healthcheck
          mkdir -p ../web/public/api
          curl -fsS http://localhost:3000/api/projects > ../web/public/api/projects
          curl -fsS http://localhost:3000/api/build-info > ../web/public/api/build-info
          kill $API_PID
      - uses: actions/configure-pages@v6
      - name: Build site
        working-directory: apps/web
        run: npm run build -- --base=/${{ github.event.repository.name }}/
      - uses: actions/upload-pages-artifact@v5
        with:
          path: apps/web/dist

  pages-deploy:
    needs: pages-build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
