server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    # Browser-enforced allowlist: the page can only load from and talk to this origin,
    # so images processed by the OCR tool can't be sent anywhere else.
    # 'wasm-unsafe-eval' is required to run the Tesseract WebAssembly engine.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self'; img-src 'self' blob: data:; connect-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    # Forward API calls to the api service (compose service / k8s Service name)
    location /api/ {
        proxy_pass http://api:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        try_files $uri /index.html;
    }
}
